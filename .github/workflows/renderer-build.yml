name: Build & Push Worksheet Renderer

# Eigenes Image für den Arbeitsblatt-Renderer (worksheet-renderer/), nur wenn
# sich dort etwas ändert. Das App-Image baut docker-build.yml.
on:
  push:
    branches:
      - master
    paths:
      - 'worksheet-renderer/**'
      - '.github/workflows/renderer-build.yml'

jobs:
  build-and-push:
    # Nativ auf ARM (für öffentliche Repositories kostenlos). Dazu amd64 für
    # Windows-PCs (docker-compose.yaml des lm-editor) – über QEMU emuliert und
    # darum langsamer; der Renderer ändert sich selten.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (für amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: worksheet-renderer
          push: true
          platforms: linux/arm64,linux/amd64
          build-args: RENDERER_VERSION=${{ github.sha }}
          tags: ghcr.io/mmetzler-fes/worksheet-renderer:latest
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer
