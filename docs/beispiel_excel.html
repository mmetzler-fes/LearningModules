<script>
/* ---- engine.js ---- */
/* ===================== XL – Mini-Excel-Engine (deutsche Syntax) ===================== */
const XL = (() => {
  const colToNum = s => s.toUpperCase().split('').reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0);
  const numToCol = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

  const addr = (c, r) => numToCol(c) + r;
  const refStr = o => (o.ac ? '$' : '') + numToCol(o.c) + (o.ar ? '$' : '') + o.r;

  class Err { constructor(code, msg) { this.code = code; this.msg = msg || ''; } toString() { return this.code; } }
  const E = (c, m) => new Err(c, m);
  const isErr = v => v instanceof Err;

  /* ---------- Datum/Zeit ---------- */
  const DAY = 86400000, BASE = Date.UTC(1899, 11, 30);
  const dateToSerial = (y, m, d) => (Date.UTC(y, m - 1, d) - BASE) / DAY;
  const serialToDate = s => { const d = new Date(BASE + Math.floor(s) * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; };
  const todaySerial = () => { const n = new Date(); return dateToSerial(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
  const validDate = (y, m, d) => { if (m < 1 || m > 12 || d < 1) return false; const t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCMonth() === m - 1; };

  /* ---------- Literale (Eingabe ohne =) ---------- */
  const deNum = s => Number(s.replace(/\./g, '').replace(',', '.'));
  function parseLiteral(raw) {
    const s0 = String(raw);
    if (s0 === '') return { v: null, typ: 'Leer' };
    if (s0[0] === "'") return { v: s0.slice(1), typ: 'Text', hint: 'Apostroph erzwingt Text' };
    const s = s0.trim();
    let m;
    if (/^(WAHR|FALSCH)$/i.test(s)) return { v: /^WAHR$/i.test(s), typ: 'Wahrheitswert' };
    if (/^#(DIV\/0!|NV|WERT!|BEZUG!|NAME\?|ZAHL!|NULL!)$/i.test(s)) return { v: E(s.toUpperCase()), typ: 'Fehlerwert' };
    if ((m = /^(-?)(\d+(?:,\d+)?)\s?%$/.exec(s))) return { v: (m[1] ? -1 : 1) * deNum(m[2]) / 100, typ: 'Zahl', fmt: 'pct', sub: 'Prozent' };
    if ((m = /^(-?)(\d{1,3}(?:\.\d{3})*(?:,\d+)?|\d+(?:,\d+)?)\s?€$/.exec(s))) return { v: (m[1] ? -1 : 1) * deNum(m[2]), typ: 'Zahl', fmt: 'eur', sub: 'Währung' };
    if ((m = /^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})?$/.exec(s)) || (m = /^(\d{1,2})\.(\d{1,2})$/.exec(s))) {
      const d = +m[1], mo = +m[2]; let y = m[3] ? +m[3] : 2026; if (m[3] && m[3].length === 2) y += y < 30 ? 2000 : 1900;
      if (validDate(y, mo, d)) return { v: dateToSerial(y, mo, d), typ: 'Datum', fmt: 'date', hint: m[3] ? '' : 'Ohne Jahr ergänzt Excel das aktuelle Jahr' };
    }
    if ((m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(s))) { const h = +m[1], mi = +m[2], se = +(m[3] || 0); if (mi < 60 && se < 60) return { v: (h * 3600 + mi * 60 + se) / 86400, typ: 'Uhrzeit', fmt: 'time' }; }
    if (/^-?\d+(,\d+)?([eE][+-]?\d+)?$/.test(s)) return { v: Number(s.replace(',', '.')), typ: 'Zahl' };
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return { v: deNum(s), typ: 'Zahl', hint: 'Punkt als Tausendertrennzeichen' };

  }

  /* ---------- Tokenizer ---------- */
  const OPS = ['<=', '>=', '<>', '+', '-', '*', '/', '^', '&', '=', '<', '>', '%', '(', ')', ';', ':'];
  function tokenize(src) {

      if ((m = /^([A-Za-zÄÖÜäöü][A-Za-zÄÖÜäöü0-9.]*)\s*\(/.exec(rest)) && !/^\$?[A-Za-z]{1,3}\$?\d+$/.test(m[1])) { t.push({ t: 'fn', v: m[1].toUpperCase() }); i += m[0].length; continue; }
      if ((m = /^(WAHR|FALSCH)(?![A-Za-z0-9(])/i.exec(rest))) { t.push({ t: 'bool', v: /^WAHR$/i.test(m[1]) }); i += m[0].length; continue; }
      if ((m = /^(\$?[A-Za-z]{1,3}\$?\d+)(?::(\$?[A-Za-z]{1,3}\$?\d+))?(?![A-Za-z0-9(])/.exec(rest))) { t.push({ t: 'ref', v: m[1].toUpperCase(), v2: m[2] ? m[2].toUpperCase() : null }); i += m[0].length; continue; }
      if ((m = /^\d+\.\d+/.exec(rest)) && !/^\d+\.\d+,/.test(rest)) throw E('#NAME?', 'Dezimaltrennzeichen im deutschen Excel ist das Komma (z. B. 0,19)');
      if ((m = /^\d+(?:,\d+)?(?:[eE][+-]?\d+)?/.exec(rest))) { t.push({ t: 'num', v: Number(m[0].replace(',', '.')) }); i += m[0].length; continue; }
      if (ch === ',') throw E('#NAME?', 'Argumente werden im deutschen Excel mit Semikolon ; getrennt');
      if ((m = /^#(DIV\/0!|NV|WERT!|BEZUG!|NAME\?|ZAHL!)/.exec(rest))) { t.push({ t: 'err', v: m[0] }); i += m[0].length; continue; }
      if ((m = /^[A-Za-zÄÖÜäöü_][A-Za-zÄÖÜäöü0-9_]*/.exec(rest))) throw E('#NAME?', `„${m[0]}“ ist unbekannt – Text gehört in Anführungszeichen, Funktionen brauchen Klammern`);

  function parse(src) {

/* ===================== XLSX-Export (offline, ohne Bibliothek) ===================== */
const XLSX = (() => {
  const FN = { SUMME: 'SUM', PRODUKT: 'PRODUCT', MITTELWERT: 'AVERAGE', MIN: 'MIN', MAX: 'MAX', ANZAHL: 'COUNT', ANZAHL2: 'COUNTA', ANZAHLLEEREZELLEN: 'COUNTBLANK', RUNDEN: 'ROUND', AUFRUNDEN: 'ROUNDUP', ABRUNDEN: 'ROUNDDOWN', GANZZAHL: 'INT', REST: 'MOD', ABS: 'ABS', WURZEL: 'SQRT', POTENZ: 'POWER', PI: 'PI', SUMMENPRODUKT: 'SUMPRODUCT', WENN: 'IF', UND: 'AND', ODER: 'OR', NICHT: 'NOT', WENNFEHLER: 'IFERROR', 'ZÄHLENWENN': 'COUNTIF', SUMMEWENN: 'SUMIF', 'ZÄHLENWENNS': 'COUNTIFS', SUMMEWENNS: 'SUMIFS', SVERWEIS: 'VLOOKUP', XVERWEIS: '_xlfn.XLOOKUP', VERKETTEN: 'CONCATENATE', TEXTKETTE: '_xlfn.CONCAT', 'LÄNGE': 'LEN', LINKS: 'LEFT', RECHTS: 'RIGHT', HEUTE: 'TODAY', DATUM: 'DATE', TAG: 'DAY', MONAT: 'MONTH', JAHR: 'YEAR', STUNDE: 'HOUR' };
  const ERR = { '#NV': '#N/A', '#WERT!': '#VALUE!', '#BEZUG!': '#REF!', '#ZAHL!': '#NUM!', '#NAME?': '#NAME?', '#DIV/0!': '#DIV/0!', '#ZIRKEL': '#REF!' };
  const qs = n => /^[A-Za-z_][A-Za-z0-9_.]*$/.test(n) ? n : `'${n.replace(/'/g, "''")}'`;
  function toEn(f) {
    return XL.tokenize(f.slice(1)).map(t => {
      switch (t.t) {
        case 'num': return String(t.v);
        case 'str': return '"' + t.v.replace(/"/g, '""') + '"';
        case 'bool': return t.v ? 'TRUE' : 'FALSE';
        case 'err': return ERR[t.v] || t.v;
        case 'fn': return (FN[t.v] || t.v) + '(';
        case 'ref': return (t.sh ? qs(t.sh) + '!' : '') + t.v + (t.v2 ? ':' + t.v2 : '');
        case 'op': return t.v === ';' ? ',' : t.v;
      }
      return '';
    }).join('');
  }
  const x = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function numFmt(f) {
    f = XL.normFmt(f); let m; const dz = d => d > 0 ? '0.' + '0'.repeat(d) : '0';
    if (f === 'gen') return [0];
    if (f === 'n0') return [1]; if (f === 'n2') return [2]; if ((m = /^n(\d)$/.exec(f))) return [null, dz(+m[1])];
    if (f === 'pct0') return [9]; if (f === 'pct2') return [10]; if ((m = /^pct(\d)$/.exec(f))) return [null, dz(+m[1]) + '%'];
