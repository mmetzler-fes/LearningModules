# Beispiel für den Server – Variante A: Versand über ein vorhandenes Postfach.
# Das Passwort steht NICHT hier, sondern in einer .env-Datei daneben:
#
#   echo 'SMTP_PASS=geheim' > .env && chmod 600 .env
#
services:
  learningmodules-server:
    image: ghcr.io/mmetzler-fes/learningmodules-server:latest
    container_name: learningmodules-server
    restart: always
    volumes:
      - ./data:/app/data
    networks:
      - proxy-nw
    expose:
      - "3000"
    environment:
      MAIL_TRANSPORT: smtp
      SMTP_HOST: smtp.dein-provider.de
      SMTP_PORT: "587"
      SMTP_SECURE: "false"          # "true" nur bei Port 465
      # Unverschlüsselter Versand ist verboten (Vorgabe). Nur auf "false"
      # setzen, wenn der Mailserver kein STARTTLS kann:
      SMTP_REQUIRE_TLS: "true"
      # Absender: Postfach einer Domain, für die du senden darfst.
      # Fremde Absenderdomains scheitern an SPF/DMARC.
      SMTP_USER: lernmodule@metzlercloud.de
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: "LearningModules <lernmodule@metzlercloud.de>"
      # Erscheint als Adresszeile in der Mail an den neuen Benutzer:
      APP_URL: https://lm.metzlercloud.de
      JWT_SECRET: ${JWT_SECRET}     # sonst gilt der Vorgabewert "secretKey"
      # Schützt die gespeicherten Masterkeys (mind. 16 Zeichen). Ohne legt die
      # App data/.app-secret an – dann liegen Schlüssel und Schutz im selben
      # Verzeichnis. Nicht ändern, sonst sind die Masterkeys nicht mehr lesbar.
      APP_SECRET: ${APP_SECRET}
      # Zeitzone für den Zeitplan des automatischen Backups (sonst UTC).
      TZ: Europe/Berlin
      # Vernetzung mit anderen Servern (docs/vernetzung.md): Die öffentliche
      # Adresse kommt aus APP_URL. Die Uhr des Hosts muss stimmen (NTP).
      # Nur zum Ausprobieren ohne https, nie im Betrieb:
      # FEDERATION_ALLOW_HTTP: "1"
      # Arbeitsblätter (.odt/.pdf) – nur mit dem Renderer unten:
      # WORKSHEET_RENDERER_URL: http://worksheet-renderer:8090
      # WORKSHEET_RENDERER_TOKEN: ${WORKSHEET_RENDERER_TOKEN}
      # PDF-Import mit KI-Erkennung – nur mit dem Dienst pdf-ai unten:
      # PDF_AI_URL: http://pdf-ai:8091
      # PDF_AI_TOKEN: ${PDF_AI_TOKEN}

  # Optional: Renderer für Arbeitsblätter (worksheet-renderer/README.md).
  # Eigenes Image mit LibreOffice; nur im internen Netz, kein Port nach außen.
  # Das Token (beliebige lange Zeichenfolge) steht in der .env wie SMTP_PASS.
  # worksheet-renderer:
  #   image: ghcr.io/mmetzler-fes/worksheet-renderer:latest
  #   container_name: worksheet-renderer
  #   restart: always
  #   networks:
  #     - proxy-nw
  #   environment:
  #     WORKSHEET_RENDERER_TOKEN: ${WORKSHEET_RENDERER_TOKEN}
  #     RENDERER_WORKERS: "2"

  # Optional: PDF-Import mit KI-Erkennung (pdf-ai/README.md). Großes Image
  # (PyTorch, Modelle), braucht während einer Erkennung 1,5–2 GB Speicher.
  # Ohne ihn gibt es „Text mit Struktur“ und „Seiten als Bilder“ (Renderer).
  # pdf-ai:
  #   image: ghcr.io/mmetzler-fes/pdf-ai:latest
  #   container_name: pdf-ai
  #   restart: always
  #   networks:
  #     - proxy-nw
  #   environment:
  #     PDF_AI_TOKEN: ${PDF_AI_TOKEN}

networks:
  proxy-nw:
    external: true
    name: nginx-proxy-network
