name: Build & Push PDF-KI (pdf-ai)

# Eigenes Image für den PDF-Import mit KI-Erkennung (pdf-ai/, docling), nur wenn
# sich dort etwas ändert. Groß (PyTorch, Modelle) – deshalb getrennt vom Renderer.
on:
  push:
    branches:
      - master
    paths:
      - 'pdf-ai/**'
      - '.github/workflows/pdf-ai-build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: pdf-ai
          push: true
          platforms: linux/arm64
          build-args: PDF_AI_VERSION=${{ github.sha }}
          tags: ghcr.io/mmetzler-fes/pdf-ai:latest
          cache-from: type=gha,scope=pdf-ai
          cache-to: type=gha,mode=max,scope=pdf-ai
